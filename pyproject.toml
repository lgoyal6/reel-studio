[project]
name = "reel-studio"
version = "0.1.0"
description = "A conversational, reversible audio workstation for short video"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "pydantic>=2.10,<3", "numpy>=1.26,<2", "scipy>=1.14,<2",
  "soundfile>=0.13,<1", "librosa>=0.11,<1", "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/reelstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
